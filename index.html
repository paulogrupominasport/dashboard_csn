<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo Minas Port | Dashboard CSN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --mp-black: #242424;
      --mp-charcoal: #333333;
      --mp-lime: #b8d51b;
      --mp-lime-dark: #8fa915;
      --mp-soft: #f4f6f8;
      --mp-border: #e5e7eb;
    }
    html { scroll-behavior: smooth; }
    body { background: #f3f4f6; color: #1f2937; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.05); }
    .kpi-accent { border-top: 4px solid var(--mp-lime); }
    .btn-primary { background: var(--mp-lime); color: #1f2937; font-weight: 800; }
    .btn-primary:hover { background: #a9c513; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #e5e7eb; color: #1f2937; font-weight: 600; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-secondary.active { background: var(--mp-lime); color: #1f2937; }
    .btn-dark { background: var(--mp-black); color: white; }
    .btn-dark:hover { background: #111827; }
    .btn-dark:disabled { background: #999; cursor: not-allowed; }
    .progress-track { background:#e5e7eb; border-radius:999px; overflow:hidden; height:8px; }
    .progress-fill { background:linear-gradient(90deg,var(--mp-lime-dark),var(--mp-lime)); height:100%; border-radius:999px; }
    .table-head { background: #242424; color: white; }
    .sticky-head thead th { position: sticky; top: 0; z-index: 4; }
    .tab-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
    .alert-info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .loading-spinner {
      border: 4px solid #e5e7eb;
      border-top: 4px solid var(--mp-lime);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-badge { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 600;
    }
    .status-online { background: #dcfce7; color: #166534; }
    .status-offline { background: #fee2e2; color: #991b1b; }
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
      .card { box-shadow: none; }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="dashboard" class="max-w-[1600px] mx-auto p-4 md:p-6 lg:p-8">
    <!-- HEADER -->
    <header class="card overflow-hidden mb-6">
      <div class="bg-[#242424] px-5 py-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div class="flex items-center gap-5">
          <svg class="w-10 h-10 text-[#b8d51b]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M11 3a1 1 0 10-2 0 1 1 0 002 0zm0 6a1 1 0 10-2 0 1 1 0 002 0zm0 6a1 1 0 10-2 0 1 1 0 002 0z"/>
            <path d="M13 3a8 8 0 100 16 8 8 0 000-16zM1 11a10 10 0 1120 0 10 10 0 01-20 0z"/>
          </svg>
          <div>
            <h1 class="text-xl font-bold text-white">Grupo Minas Port</h1>
            <p class="text-xs text-gray-400">Dashboard CSN - Pedidos e Saldos</p>
          </div>
        </div>
        <div class="flex gap-3 items-center flex-wrap">
          <div class="flex items-center gap-2">
            <div id="statusBadge" class="status-badge status-offline">🔄 Conectando...</div>
          </div>
          <button id="refreshBtn" class="btn-primary px-4 py-2 rounded-lg text-sm">↻ Atualizar</button>
          <button id="exportPdfBtn" class="btn-dark px-4 py-2 rounded-lg text-sm" disabled>⬇ PDF</button>
        </div>
      </div>
    </header>

    <!-- MENSAGENS DE STATUS -->
    <div id="messages"></div>

    <!-- ÁREA DE CARREGAMENTO -->
    <div id="loadingArea" class="card p-8 text-center">
      <div class="loading-spinner mb-4"></div>
      <p class="text-gray-600">Carregando dados do Google Sheets...</p>
      <p class="text-sm text-gray-500 mt-2">URL: 🔗 Google Sheets</p>
    </div>

    <!-- ABAS POR MÊS (OCULTAS ATÉ CARREGAR) -->
    <div id="tabsArea" style="display: none;">
      <div class="card mb-6 p-5">
        <div class="tab-buttons" id="monthTabs"></div>
      </div>

      <!-- CONTEÚDO POR MÊS -->
      <div id="monthsContainer"></div>
    </div>
  </div>

  <script>
    // Configuração
    const GOOGLE_SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1uBHSngHmnOWt23d0UNvBiZmFj_APglmmfvwOPhefzJaqIBaoP7KLK_-ipCgQKjB13TTymmCDO1dq/pub?output=xlsx";
    
    // Estado global
    let allMonthsData = {};
    let currentMonth = null;
    let lastUpdateTime = null;

    // Funções de formatação
    const fmtN = v => new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 0, maximumFractionDigits: 0}).format(v);
    const fmtT = v => new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2}).format(v) + " t";

    // Mapeamento de unidades
    const unitShortNames = {
      "ARCOS": "Arcos",
      "BARROSO": "Barroso",
      "CANTAGALO": "Cantagalo",
      "MONTES CLAROS": "Montes Claros",
      "PEDRO LEOPOLDO": "P. Leopoldo",
      "VOLTA REDONDA": "V. Redonda"
    };

    // Mostrar mensagem
    function showMessage(text, type = "info") {
      const messagesDiv = document.getElementById("messages");
      const msg = document.createElement("div");
      msg.className = `alert alert-${type}`;
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      
      if (type !== "error") {
        setTimeout(() => msg.remove(), 6000);
      }
    }

    // Atualizar badge de status
    function setStatus(online, message = "") {
      const badge = document.getElementById("statusBadge");
      if (online) {
        badge.className = "status-badge status-online";
        badge.textContent = message || "🟢 Online";
      } else {
        badge.className = "status-badge status-offline";
        badge.textContent = message || "🔴 Offline";
      }
    }

    // Carregar arquivo do Google Sheets
    async function loadGoogleSheetsData() {
      try {
        setStatus(false, "🔄 Carregando...");
        
        console.log("📥 Buscando arquivo do Google Sheets...");
        const response = await fetch(GOOGLE_SHEETS_URL);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: "array" });

        console.log("✅ Arquivo baixado com sucesso");
        console.log("📋 Abas:", workbook.SheetNames);

        // Procurar aba "Pedidos x Saldos"
        if (!workbook.SheetNames.includes("Pedidos x Saldos")) {
          throw new Error("Aba 'Pedidos x Saldos' não encontrada no arquivo");
        }

        const worksheet = workbook.Sheets["Pedidos x Saldos"];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        console.log("🔍 Parseando dados...");
        parseExcelData(jsonData);
        
        lastUpdateTime = new Date().toLocaleTimeString("pt-BR");
        setStatus(true, `🟢 Online - ${lastUpdateTime}`);
        showMessage(`✓ Dados carregados com sucesso do Google Sheets! Atualizado em ${lastUpdateTime}`, "success");
        
        // Mostrar dashboard e ocultar loading
        document.getElementById("loadingArea").style.display = "none";
        document.getElementById("tabsArea").style.display = "block";
        document.getElementById("exportPdfBtn").disabled = false;

      } catch (error) {
        console.error("❌ Erro ao carregar:", error);
        setStatus(false, "🔴 Erro");
        showMessage(`❌ Erro ao carregar dados: ${error.message}`, "error");
        document.getElementById("loadingArea").innerHTML = `
          <div class="text-center">
            <p class="text-lg font-bold text-red-600 mb-4">Erro ao conectar</p>
            <p class="text-gray-600 mb-4">${error.message}</p>
            <button id="retryBtn" class="btn-primary px-6 py-2 rounded-lg">🔄 Tentar Novamente</button>
          </div>
        `;
        document.getElementById("retryBtn").addEventListener("click", loadGoogleSheetsData);
      }
    }

    // Parser de dados Excel
    function parseExcelData(jsonData) {
      allMonthsData = {};
      let currentMonth = null;
      let headerRow = null;

      for (let i = 0; i < jsonData.length; i++) {
        const row = jsonData[i];
        
        // Procurar nome do mês
        if (row[0] && typeof row[0] === "string") {
          const monthName = row[0].toUpperCase().trim();
          const meses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
                        "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
          
          if (meses.includes(monthName)) {
            currentMonth = monthName;
            allMonthsData[currentMonth] = [];
            headerRow = null;
            console.log(`📅 Mês encontrado: ${currentMonth}`);
            continue;
          }
        }

        // Procurar linha de cabeçalho
        if (currentMonth && !headerRow && row[0] === "UNIDADE") {
          headerRow = { unit: 0, order: 1, qty: 2 };
          console.log(`   Cabeçalho encontrado`);
          continue;
        }

        // Processar dados do mês
        if (currentMonth && headerRow && row[0] && row[0] !== "UNIDADE" && row[0] !== "TOTAL") {
          const unit = String(row[0]).trim();
          const order = String(row[headerRow.order] || "").trim();
          let qty = row[headerRow.qty];

          // Processar quantidade
          if (typeof qty === "string" && qty.includes("=")) {
            // Fórmula - não processar aqui, será 0
            qty = 0;
            console.log(`   ⚠️ ${unit}: fórmula não calculada (${qty})`);
          } else {
            qty = Number(qty) || 0;
          }

          if (unit && order) {
            allMonthsData[currentMonth].push({
              unit: unit,
              order: order,
              qty: Math.round(qty)
            });
            console.log(`   ✓ ${unit}: Pedido ${order} - ${qty}`);
          }
        }
      }

      // Remover meses vazios
      Object.keys(allMonthsData).forEach(month => {
        if (allMonthsData[month].length === 0) {
          delete allMonthsData[month];
        }
      });

      if (Object.keys(allMonthsData).length === 0) {
        throw new Error("Nenhum dado de mês foi encontrado no arquivo");
      }

      console.log(`✅ ${Object.keys(allMonthsData).length} mês(es) carregado(s)`);
      renderMonthTabs();
      renderMonthContents();
    }

    // Renderizar abas dos meses
    function renderMonthTabs() {
      const container = document.getElementById("monthTabs");
      container.innerHTML = "";

      const months = Object.keys(allMonthsData).sort();
      months.forEach((month, index) => {
        const btn = document.createElement("button");
        btn.className = "tab-btn btn-secondary";
        if (index === 0) {
          btn.classList.add("active");
          currentMonth = month;
        }
        btn.textContent = month;
        btn.addEventListener("click", () => switchMonth(month));
        container.appendChild(btn);
      });
    }

    // Trocar mês ativo
    function switchMonth(month) {
      currentMonth = month;

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.remove("active");
        if (btn.textContent === month) {
          btn.classList.add("active");
        }
      });

      document.querySelectorAll(".tab-content").forEach(content => {
        content.classList.remove("active");
      });
      document.getElementById(`month-${month}`).classList.add("active");
    }

    // Renderizar conteúdo dos meses
    function renderMonthContents() {
      const container = document.getElementById("monthsContainer");
      container.innerHTML = "";

      Object.entries(allMonthsData).forEach(([month, data]) => {
        const monthDiv = document.createElement("div");
        monthDiv.id = `month-${month}`;
        monthDiv.className = "tab-content";
        if (month === Object.keys(allMonthsData)[0]) {
          monthDiv.classList.add("active");
        }

        const totalQty = data.reduce((sum, item) => sum + item.qty, 0);

        // Cabeçalho do mês
        const header = document.createElement("div");
        header.className = "card mb-6 p-6 bg-gradient-to-r from-[#242424] to-[#333333] text-white";
        header.innerHTML = `
          <h2 class="text-2xl font-bold mb-2">${month}</h2>
          <p class="text-sm text-gray-300">Total de pedidos: <span class="font-bold text-[#b8d51b]">${fmtT(totalQty)}</span> | Unidades: <span class="font-bold">${data.length}</span></p>
        `;
        monthDiv.appendChild(header);

        // Cards de pedidos
        const cardsContainer = document.createElement("div");
        cardsContainer.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6";

        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card kpi-accent p-5";
          card.innerHTML = `
            <div class="flex justify-between items-start mb-3">
              <div>
                <p class="text-xs text-gray-500 font-semibold">UNIDADE</p>
                <p class="text-lg font-bold text-[#242424]">${unitShortNames[item.unit] || item.unit}</p>
              </div>
              <span class="bg-[#b8d51b] text-[#242424] text-xs font-bold px-2 py-1 rounded">Pedido</span>
            </div>
            <div class="border-t border-gray-200 pt-3 mb-3">
              <p class="text-xs text-gray-500 font-semibold">NÚMERO DO PEDIDO</p>
              <p class="text-2xl font-bold text-[#b8d51b] font-mono">${item.order}</p>
            </div>
            <div class="bg-[#f4f6f8] rounded-lg p-3">
              <p class="text-xs text-gray-500 font-semibold">QUANTIDADE PEDIDA</p>
              <p class="text-3xl font-bold text-[#242424]">${fmtN(item.qty)}</p>
              <p class="text-xs text-gray-600">toneladas</p>
            </div>
          `;
          cardsContainer.appendChild(card);
        });

        monthDiv.appendChild(cardsContainer);

        // Tabela resumida
        const tableDiv = document.createElement("div");
        tableDiv.className = "card mb-6 overflow-x-auto";
        tableDiv.innerHTML = `
          <table class="w-full">
            <thead class="table-head">
              <tr>
                <th class="px-6 py-3 text-left text-sm font-semibold">UNIDADE</th>
                <th class="px-6 py-3 text-left text-sm font-semibold">Nº PEDIDO</th>
                <th class="px-6 py-3 text-right text-sm font-semibold">QUANTIDADE (t)</th>
              </tr>
            </thead>
            <tbody>
              ${data.map((item, idx) => `
                <tr class="${idx % 2 === 0 ? 'bg-white' : 'bg-[#f9fafb]'} border-b border-gray-200">
                  <td class="px-6 py-4 text-sm font-medium">${item.unit}</td>
                  <td class="px-6 py-4 text-sm font-mono text-[#b8d51b]">${item.order}</td>
                  <td class="px-6 py-4 text-sm text-right font-semibold">${fmtN(item.qty)}</td>
                </tr>
              `).join('')}
              <tr class="bg-[#242424] text-white font-bold">
                <td class="px-6 py-4 text-sm">TOTAL</td>
                <td class="px-6 py-4 text-sm">—</td>
                <td class="px-6 py-4 text-sm text-right">${fmtN(totalQty)}</td>
              </tr>
            </tbody>
          </table>
        `;
        monthDiv.appendChild(tableDiv);

        container.appendChild(monthDiv);
      });
    }

    // Exportar PDF
    document.getElementById("exportPdfBtn").addEventListener("click", async function() {
      if (!currentMonth) {
        showMessage("Selecione um mês primeiro", "error");
        return;
      }

      this.disabled = true;
      const originalText = this.textContent;
      this.textContent = "Gerando PDF...";

      try {
        const monthElement = document.getElementById(`month-${currentMonth}`);
        const clonedElement = monthElement.cloneNode(true);

        const tempContainer = document.createElement("div");
        tempContainer.style.position = "absolute";
        tempContainer.style.left = "-9999px";
        tempContainer.style.top = "-9999px";
        tempContainer.style.width = "1200px";
        tempContainer.style.background = "white";
        tempContainer.appendChild(clonedElement);
        document.body.appendChild(tempContainer);

        const canvas = await html2canvas(tempContainer, {
          backgroundColor: "#ffffff",
          scale: 2,
          useCORS: true
        });

        document.body.removeChild(tempContainer);

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4"
        });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const imgW = pageW - 20;
        const imgH = (canvas.height * imgW) / canvas.width;

        let heightLeft = imgH;
        let position = 10;

        const img = canvas.toDataURL("image/jpeg");

        pdf.addImage(img, "JPEG", 10, position, imgW, imgH);
        heightLeft -= pageH - 20;

        while (heightLeft > 0) {
          position = heightLeft - imgH;
          pdf.addPage();
          pdf.addImage(img, "JPEG", 10, position, imgW, imgH);
          heightLeft -= pageH;
        }

        const fileName = `Dashboard-CSN-${currentMonth}.pdf`;
        pdf.save(fileName);

        showMessage(`✓ PDF "${fileName}" gerado com sucesso!`, "success");
      } catch (error) {
        console.error("Erro ao gerar PDF:", error);
        showMessage("❌ Erro ao gerar PDF", "error");
      } finally {
        this.disabled = false;
        this.textContent = originalText;
      }
    });

    // Botão de atualizar
    document.getElementById("refreshBtn").addEventListener("click", async function() {
      this.disabled = true;
      this.textContent = "↻ Atualizando...";
      document.getElementById("messages").innerHTML = "";
      
      await loadGoogleSheetsData();
      
      this.disabled = false;
      this.textContent = "↻ Atualizar";
    });

    // Carregar dados ao abrir a página
    window.addEventListener("load", loadGoogleSheetsData);
  </script>
</body>
</html>
